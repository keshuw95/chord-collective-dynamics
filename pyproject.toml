[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chord"
version = "0.1.0"
description = "Learning collective dynamics beyond pairwise relations via latent higher-order interactions"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "torchdiffeq>=0.2.4", "entmax>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["chord*"]
